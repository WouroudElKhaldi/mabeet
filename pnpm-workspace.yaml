allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  esbuild: true
  prisma: true
  unrs-resolver: true
  "@parcel/watcher": false
  "@swc/core": false
  # The local database of `pnpm db:start`. On macOS and Linux (also inside Docker) its install script links the
  # Postgres libraries; the Windows build needs none.
  "@embedded-postgres/darwin-arm64": true
  "@embedded-postgres/darwin-x64": true
  "@embedded-postgres/linux-arm64": true
  "@embedded-postgres/linux-x64": true
  "@embedded-postgres/windows-x64": false
